name: Check tag
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Run a script with a secret
        env:
          CYPCODE_ORG_NAME: ${{ secrets.CYPCODE_ORG_NAME }}
        run: |
          python -c "
          import yaml
          with open('../swagger.yml', 'r') as f:
              data = yaml.safe_load(f)
              tag = data.get('private', 'not found')
              print(f'Found tag: {tag}')
          "
