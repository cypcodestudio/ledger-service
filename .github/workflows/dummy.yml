name: Check Tag and Call API
on: workflow_dispatch

jobs:
  api-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract tag and set output
        id: check_tag # We need this ID to reference the output later
        run: |
          python -c "
          import yaml
          import os

          try:
              with open('swagger.yml', 'r') as f:
                  data = yaml.safe_load(f)
              
              tag = data.get('internal')
              
              if tag:
                  print(f'Tag found: {tag}')
                  # This line saves the tag so other steps can see it
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                      f.write(f'found=true\n')
                      f.write(f'tag_value={tag}\n')
              else:
                  print('Tag not found.')
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                      f.write(f'found=false\n')
          except FileNotFoundError:
              print('File not found.')
          "

      - name: Run API Call
        # This step ONLY runs if the Python script found the tag
        if: steps.check_tag.outputs.found == 'true'
        env:
          ORG_NAME: ${{ secrets.CYPCODE_ORG_NAME }}
          TAG_VAL: ${{ steps.check_tag.outputs.tag_value }}
        run: |
          echo "Tag was found ($TAG_VAL). Triggering API call..."
